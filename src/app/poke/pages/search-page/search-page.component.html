<div class="p-2">
  <h2 class="text-2xl font-bold">Buscar Pokemons</h2>
  <h3 class="text-sm text-gray-500">Buscar pokemon por tipo venga mama un poco</h3>

  <section class="flex flex-col gap-4">
    <input
      type="text"
      placeholder="Buscar Pokemons"
      class="mt-3 border border-gray-300 rounded-b-md p-2"
      (keyup.enter)="onSearch(txtSearch.value)"
      #txtSearch
    />
  </section>

  <section class="py-5">
    <poke-list-component [poke]="pokemons()" />
  </section>
</div>
